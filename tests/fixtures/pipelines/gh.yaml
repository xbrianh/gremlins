default_client: 'xai:grok-4'

base_ref: main

github_integration: true

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: [filepath, string]
      optional: true
  launch_cmds:
    - gremlins:bind_artifact("artifact://plan.md", plan)
    - gremlins:bind_artifact("artifact://instructions.txt", instructions)

land:
  interpolation:
    PR_URL: content("artifact://pr-url.txt")
  options:
    cmds:
      - gh pr merge --squash --delete-branch "$PR_URL"

prompts:
  code-style: gremlins:code_style.md
  verify: [gremlins:verify_fix.md, gremlins:bail_section_fix.md]

stages:
  - { type: gremlins:plan-gh,      prompt: [code-style, gremlins:plan_gh.md] }
  - { type: gremlins:implement,   prompt: [code-style, gremlins:implement_gh.md] }
  - name: normalize
    type: exec
    options:
      cmds:
        - "ruff format . && ruff check --fix . && git add -A && (git diff --cached --quiet || git commit -m 'normalize')"
  - { name: verify-check, type: verify, options: { cmds: ["make check"] }, prompt: verify }
  - { name: verify-test,  type: verify, options: { cmds: ["make test"] },  prompt: verify }
  - { name: open-pr,    type: gremlins:github-open-pr }
  - { type: gremlins:github-request-copilot-review }
  - name: fetch-pr-diff
    type: exec
    interpolation:
      pr: content("artifact://pr-url.txt")
    bind:
      pr_diff: "artifact://diff.txt"
    options:
      cmds:
        - "gh pr diff --name-only \"{pr}\" > \"{pr_diff}\""
  - { name: github-review-pull-request,                 type: agent, interpolation: {pr: content("artifact://pr-url.txt"), plan: content("artifact://plan.md"), diff: content("artifact://diff.txt")}, prompt: [code-style, gremlins:github_review_pull_request.md] }
  - { type: gremlins:github-wait-copilot }
  - name: gather-github-review-content
    type: exec
    interpolation:
      pr: content("artifact://pr-url.txt")
    bind:
      github_review_content: "artifact://github-review-content.md"
    options:
      cmds:
        - |
          set -e
          set -o pipefail
          PR_URL="{pr}"
          PR_JSON="$(gh pr view "$PR_URL" --json number,title,body,author,baseRefName,headRefName)"
          PR_NUMBER="$(echo "$PR_JSON" | jq -r '.number')"
          OWNER_REPO="$(echo "$PR_URL" | sed 's|https://github.com/||; s|/pull/.*||')"
          PR_TITLE="$(echo "$PR_JSON" | jq -r '.title')"
          PR_BODY="$(echo "$PR_JSON" | jq -r '.body')"
          PR_AUTHOR="$(echo "$PR_JSON" | jq -r '.author.login')"
          PR_HEAD_REF="$(echo "$PR_JSON" | jq -r '.headRefName')"
          PR_BASE_REF="$(echo "$PR_JSON" | jq -r '.baseRefName')"
          {
            echo "# PR Review Comments"
            echo
            echo "**PR:** $PR_URL"
            echo "**Number:** #$PR_NUMBER"
            echo "**Title:** $PR_TITLE"
            echo "**Author:** $PR_AUTHOR"
            echo "**Branch:** $PR_HEAD_REF → $PR_BASE_REF"
            echo "**Owner/Repo:** $OWNER_REPO"
            echo
            if [ -n "$PR_BODY" ] && [ "$PR_BODY" != "null" ]; then
              echo "## PR Description"
              echo
              echo "$PR_BODY"
              echo
            fi
            echo "## Review Comments"
            echo
            gh api "repos/$OWNER_REPO/pulls/$PR_NUMBER/comments" --paginate --jq '.[] | "### Comment \(.id) by \(.user.login)\n\n\(.body)\n\n_File: `\(.path):\(.line // .original_line)`_\n\n---\n"'
            echo
            echo "## Issue Comments"
            echo
            gh pr view "$PR_URL" --comments --json comments --jq '.comments[] | "### Comment by \(.author.login) (\(.createdAt))\n\n\(.body)\n\n---\n"'
          } > "{github_review_content}"
  - name: github-address-pull-request-reviews
    type: agent
    interpolation:
      pr: content("artifact://pr-url.txt")
      content: content("artifact://github-review-content.md")
    prompt:
      - code-style
      - terse
      - dev-env
      - gremlins:github_address_pull_request_reviews.md
      - gremlins:bail_section.md
  - { name: ci-gate,    type: gremlins:github-wait-ci,  prompt: [gremlins:ci_fix.md, gremlins:bail_section_fix.md] }