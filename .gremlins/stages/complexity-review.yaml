required-prompt: true

stages:
  - name: complexity-review
    type: sequence
    body:
      - name: collect
        type: exec
        interpolation:
          inputs:
            base_sha: content("artifact://base_sha")
          outputs:
            report: "artifact://complexity-report.md"
        options:
          timeout: 300
          cmds:
            - 'cargo_modules_report "{base_sha}" "{report}"'

      - name: review
        type: agent
        interpolation:
          inputs:
            plan: content("artifact://plan.md")
            diff: content("artifact://diff.txt")
            report: content("artifact://complexity-report.md")
          outputs:
            filepath: "artifact://complexity-review.md"
        prompt:
          - "{{prompt}}"