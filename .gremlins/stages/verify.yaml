required-options:
  - cmds
required-prompt: true

stages:
  - name: verify
    type: sequence
    skip_if_exists: "artifact://{loop_iter}/done"
    max-iterations: "{{options.max_iterations | default(3)}}"
    body:
      - name: cmd
        type: exec
        interpolation:
          outputs:
            verify_log?: "artifact://{loop_iter}/verify_output.txt"
            done?: "artifact://{loop_iter}/done"
            exec_exit_code: "artifact://{loop_iter}/exec_exit_code"
        options:
          timeout: "{{options.timeout | default(900)}}"
          cmds:
            - ({{options.cmds}}) > "{verify_log}" 2>&1; rc=$?; printf '%d' "$rc" > "{exec_exit_code}"; if [ "$rc" -eq 0 ]; then printf 'done' > "{done}"; fi; true
      - name: fix
        type: sequence
        skip_if_exists: "artifact://{loop_iter}/done"
        body:
          - type: agent
            prompt:
              - "{{prompt}}"
            interpolation:
              inputs:
                verify_output: content("artifact://{loop_iter}/verify_output.txt")
