# Status file is only written when Copilot posts a non-PENDING review.
# The loop polls until that happens (or max_iterations exhausted).
# Only use in pipeline positions where HEAD does not move between poll iterations.

stages:
  - { type: github-discover-repo }
  - name: github-wait-copilot
    type: loop
    max-iterations: "{{options.max_iterations | default(40)}}"
    stop_when_exists: "artifact://{loop_iter}/status"
    options:
      interval: "{{options.interval | default(20)}}"
    body:
      - name: poll
        type: exec
        interpolation:
          pr_number: content("artifact://pr-number.txt")
          repo: content("artifact://repo.txt")
        bind:
          status?: "artifact://{loop_iter}/status"
        options:
          timeout: 30
          cmds:
            - 'output=$(gh_wait_copilot "{pr_number}" "{repo}" 2>/dev/null); if [ -n "$output" ]; then printf "%s\n" "$output" > "{status}"; fi'
