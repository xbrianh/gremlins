# Stops when the status file is written (via stop_when_exists: status) — only use
# in pipeline positions where HEAD does not move between poll iterations.

stages:
  - { type: github-discover-repo }
  - name: github-wait-copilot
    type: loop
    max-iterations: "{{options.max_iterations | default(40)}}"
    stop_when_exists: "artifact://{loop_iter}/status"
    options:
      interval: "{{options.interval | default(20)}}"
    body:
      - name: poll
        type: exec
        interpolation:
          pr_number: content("artifact://pr-number.txt")
          repo: content("artifact://repo.txt")
        bind:
          status?: "artifact://{loop_iter}/status"
        options:
          timeout: 30
          cmds:
            - |
              review=$(gh api "repos/$repo/pulls/$pr_number/reviews" \
                --jq '.[] | select(.user.login | test("[Cc]opilot")) | .state | select(. != "PENDING")')
              if [ -n "$review" ]; then
                printf '%s' "$review" > "{status}"
              fi
