type: sequence
body:
  - name: format
    type: exec
    options:
      timeout: 300
      cmds:
        - make autoformat || true
        - git add -A
        - git diff --cached --quiet || git commit -m 'format'

  - name: verify
    type: verify
    options:
      cmds:
        - "make -j8 check && make -j8 test"
      max_iterations: 7
    prompt: [style_guide.md, dev-env-howto.md, verify_fix.md]
  - name: commit
    type: exec
    options:
      cmds:
        - git add -A
        - git diff --cached --quiet || git commit -m "fix checks"