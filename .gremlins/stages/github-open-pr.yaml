stages:
  - name: resolve-pr-base
    type: exec
    interpolation:
      prev_branch_path: "artifact://pr-branch.txt?"
    bind:
      base_ref_to_open_pr: "artifact://pr-base-ref.txt"
    options:
      cmds:
        - |
          prev_branch=""
          if [ -n "$prev_branch_path" ] && [ -f "$prev_branch_path" ]; then prev_branch=$(cat "$prev_branch_path"); fi
          printf '%s' "${prev_branch:-{base_ref}}" > "$GREMLINS_ARTIFACT_DIR/pr-base-ref.txt"

  - name: diff-summary
    type: exec
    interpolation:
      base_ref_to_open_pr: content("artifact://pr-base-ref.txt")
    bind:
      diff_summary: "artifact://diff-summary.txt"
    options:
      cmds:
        - |
          {
            if git merge-base --is-ancestor "{base_ref_to_open_pr}" HEAD 2>/dev/null; then
              RANGE="{base_ref_to_open_pr}..HEAD"
            elif git rev-parse --verify HEAD~10 >/dev/null 2>&1; then
              RANGE="HEAD~10..HEAD"
            else
              ROOT=$(git rev-list --max-parents=0 HEAD)
              RANGE="${ROOT}..HEAD"
            fi
            echo "Commits:"
            git log --oneline "$RANGE" 2>/dev/null || echo "(no commits)"
            echo ""
            echo "Files changed:"
            git diff --stat "$RANGE" 2>/dev/null || echo "(no diff)"
          } > "$GREMLINS_ARTIFACT_DIR/diff-summary.txt"

  - name: compose-pr
    type: agent
    skip_if_exists: "artifact://pr-branch.txt"
    interpolation:
      base_ref_to_open_pr: content("artifact://pr-base-ref.txt")
      plan_source_issue_number: content("artifact://plan-source-issue-number.txt")?
      plan: content("artifact://plan.md")?
      diff_summary: content("artifact://diff-summary.txt")
    prompt:
      - github_open_pull_request.md
    bind:
      pr_title:  "artifact://pr-title.txt"
      pr_body:   "artifact://pr-body.md"
      pr_branch: "artifact://pr-branch.txt"

  - name: push-and-open
    type: exec
    interpolation:
      base_ref_to_open_pr: content("artifact://pr-base-ref.txt")
      pr_branch: content("artifact://pr-branch.txt")
      pr_title: content("artifact://pr-title.txt")
    bind:
      pr_number: "artifact://pr-number.txt"
      pr_url:    "artifact://pr-url.txt"
      pr_branch: "artifact://pr-branch.txt"
    options:
      cmds:
        - |
          BRANCH="$(printf '%s' "${pr_branch}")" &&
          git push origin "HEAD:refs/heads/$BRANCH" &&
          URL="$(gh pr create --head "$BRANCH" --base "$base_ref_to_open_pr" --title "$(printf '%s' "$pr_title")" --body-file "$GREMLINS_ARTIFACT_DIR/pr-body.md")" &&
          printf "%s" "${URL##*/}" > "$GREMLINS_ARTIFACT_DIR/pr-number.txt" &&
          printf "%s" "$URL" > "$GREMLINS_ARTIFACT_DIR/pr-url.txt" &&
          printf "%s" "$BRANCH" > "$GREMLINS_ARTIFACT_DIR/pr-branch.txt"
