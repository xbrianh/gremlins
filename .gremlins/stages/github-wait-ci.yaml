# Loop body: await → poll → failure-log → fix → push-fix → capture-head.
# Iteration-1 detection: fix-head absent means no prior fix push.
# Post-fix SHA verification: fix-head present → wait for headRefOid to match.

required-prompt: true

stages:
  - name: github-wait-ci
    type: loop
    max-iterations: 3
    stop_when_exists: "artifact://{loop_iter}/done"
    body:
      - name: ci-await
        type: exec
        interpolation:
          pr_url: content("artifact://pr-url.txt")
          fix_head: content("artifact://fix-head")?
        bind:
          done?: "artifact://{loop_iter}/done"
          bail?: "artifact://{loop_iter}/bail"
        options:
          timeout: 180
          startup_grace_secs: "60"
          poll_interval: "30"
          cmds:
            - |
              BAIL_MSG=$(gh_ci_await "{pr_url}" "{fix_head}" {startup_grace_secs} {poll_interval} 2>&1) || { printf '%s' "$BAIL_MSG" > "{bail}"; exit 2; }
              if [ "$BAIL_MSG" = "skipped" ]; then
                touch "{done}"
              fi

      - name: ci-poll
        type: exec
        skip_if_exists: "artifact://{loop_iter}/done"
        interpolation:
          pr_url: content("artifact://pr-url.txt")
        bind:
          status: "artifact://status"
          done?: "artifact://{loop_iter}/done"
          bail?: "artifact://{loop_iter}/bail"
        options:
          timeout: 1260
          poll_timeout: "1200"
          poll_interval: "30"
          cmds:
            - |
              BAIL_MSG=$(gh_ci_poll "{pr_url}" {poll_timeout} {poll_interval} 2>&1) || { printf '%s' "$BAIL_MSG" > "{bail}"; exit 2; }
              printf '%s' "$BAIL_MSG" > "{status}"
              if [ "$BAIL_MSG" = "passed" ]; then
                touch "{done}"
              fi

      - name: ci-failure-log
        type: exec
        skip_if_exists: "artifact://{loop_iter}/done"
        interpolation:
          pr_url: content("artifact://pr-url.txt")
        bind:
          ci_log: "artifact://ci_failure.txt"
        options:
          timeout: 120
          cmds:
            - gh_ci_failure_log "{pr_url}" > "{ci_log}"

      - name: fix
        type: agent
        skip_if_exists: "artifact://{loop_iter}/done"
        prompt:
          - "{{prompt}}"
        interpolation:
          failure_output: content("artifact://ci_failure.txt")

      - name: push-fix
        type: exec
        skip_if_exists: "artifact://{loop_iter}/done"
        interpolation:
          pr_branch: content("artifact://pr-branch.txt")
        options:
          cmds:
            - git push origin "HEAD:{pr_branch}"

      - name: capture-head
        type: exec
        skip_if_exists: "artifact://{loop_iter}/done"
        bind:
          fix_head: "artifact://fix-head"
        options:
          cmds:
            - 'git rev-parse HEAD > "{fix_head}"'