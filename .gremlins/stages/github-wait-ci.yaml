# Loop body: await → poll → failure-log → fix → push-fix → capture-head.
# Iteration-1 detection: fix-head absent means no prior fix push.
# Post-fix SHA verification: fix-head present → wait for headRefOid to match.

required-prompt: true

stages:
  - name: github-wait-ci
    type: sequence
    max-iterations: 3
    skip_if_exists: "artifact://{loop_iter}/done"
    body:
      - name: ci-await
        type: exec
        interpolation:
          pr_url: content("artifact://pr-url.txt")
          fix_head: content("artifact://fix-head")?
        bind:
          done?: "artifact://{loop_iter}/done"
        options:
          timeout: 210
          startup_grace_secs: "60"
          poll_interval: "30"
          sync_timeout: "180"
          cmds:
            - |
              set -o pipefail
              TMP_OUT="$(dirname "{done}")/ci_await_out"
              if gh_ci_await "{pr_url}" "{fix_head}" {startup_grace_secs} {poll_interval} {sync_timeout} 2>&1 | tee "$TMP_OUT"; then
                if [ "$(tail -n 1 "$TMP_OUT")" = "skipped" ]; then
                  touch "{done}"
                elif ! grep -q 'status=IN_PROGRESS' "$TMP_OUT" && grep -q 'conclusion=SUCCESS' "$TMP_OUT"; then
                  touch "{done}"
                fi
              else
                exit 2
              fi

      - name: ci-poll
        type: sequence
        skip_if_exists: "artifact://{loop_iter}/done"
        body:
          - type: exec
            interpolation:
              pr_url: content("artifact://pr-url.txt")
            bind:
              status: "artifact://{loop_iter}/status"
              done?: "artifact://{loop_iter}/done"
            options:
              timeout: 1260
              poll_timeout: "1200"
              poll_interval: "30"
              cmds:
                - |
                  set -o pipefail
                  TMP_OUT="$(dirname "{done}")/ci_poll_out"
                  if gh_ci_poll "{pr_url}" {poll_timeout} {poll_interval} 2>&1 | tee "$TMP_OUT"; then
                    cp "$TMP_OUT" "{status}"
                    if [ "$(tail -n 1 "$TMP_OUT")" = "passed" ]; then
                      touch "{done}"
                    fi
                  else
                    exit 2
                  fi

      - name: ci-failure-log
        type: sequence
        skip_if_exists: "artifact://{loop_iter}/done"
        body:
          - type: exec
            interpolation:
              pr_url: content("artifact://pr-url.txt")
            bind:
              ci_log?: "artifact://{loop_iter}/ci_failure.txt"
            options:
              timeout: 120
              cmds:
                - |
                  set -o pipefail
                  gh_ci_failure_log "{pr_url}" | tee "{ci_log}"

      - name: fix
        type: sequence
        skip_if_exists: "artifact://{loop_iter}/done"
        body:
          - type: agent
            prompt:
              - "{{prompt}}"
            interpolation:
              failure_output: content("artifact://{loop_iter}/ci_failure.txt")?

      - name: push-fix
        type: sequence
        skip_if_exists: "artifact://{loop_iter}/done"
        body:
          - type: exec
            interpolation:
              pr_branch: content("artifact://pr-branch.txt")
            options:
              cmds:
                - git push origin "HEAD:{pr_branch}"

      - name: capture-head
        type: sequence
        skip_if_exists: "artifact://fix-head"
        body:
          - type: exec
            bind:
              fix_head: "artifact://fix-head"
            options:
              cmds:
                - |
                  set -o pipefail
                  git rev-parse HEAD | tr -d '\n' | tee "{fix_head}"