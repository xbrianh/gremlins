# Wait for CI on a PR. If CI fails, hand the failure log to the agent for a
# fix, push, and loop.  The fix stage is safe when there are no failures (the
# prompt should emit a no-op), and push-fix guards against pushing an
# already-pushed HEAD.

required-prompt: true

stages:
  - name: github-wait-ci
    type: sequence
    max-iterations: 3
    skip_if_exists: "artifact://{loop_iter}/done"
    body:
      - name: ci-wait
        type: exec
        interpolation:
          pr_url: content("artifact://pr-url.txt")
          fix_head: content("artifact://fix-head")?
        bind:
          status: "artifact://{loop_iter}/status"
          done?: "artifact://{loop_iter}/done"
        options:
          timeout: 1470
          startup_grace_secs: "60"
          poll_interval: "30"
          sync_timeout: "180"
          poll_timeout: "1200"
          cmds:
            - ci_wait "{pr_url}" "{fix_head}" "{done}" "{status}" {startup_grace_secs} {poll_interval} {sync_timeout} {poll_timeout}

      - name: ci-failure-log
        type: exec
        interpolation:
          pr_url: content("artifact://pr-url.txt")
        bind:
          ci_log?: "artifact://{loop_iter}/ci_failure.txt"
        options:
          timeout: 120
          cmds:
            - ci_failure_log "{pr_url}" "{ci_log}"

      - name: fix
        type: agent
        prompt:
          - "{{prompt}}"
        interpolation:
          failure_output: content("artifact://{loop_iter}/ci_failure.txt")?

      - name: push-fix
        type: exec
        interpolation:
          pr_branch: content("artifact://pr-branch.txt")
        options:
          cmds:
            - ci_push_fix "{pr_branch}"