# Drag score optimizer — iterative refactoring loop driven by gremlins-drag.
#
# Usage:
#   gremlins launch drag-optimizer --target crates/gremlins/src/lib.rs
#   gremlins launch drag-optimizer --target src/ --drag-model openai/gpt-4o
#   gremlins launch drag-optimizer --target my_pkg/ --instructions "focus on cyclomatic complexity"
#
# Parameters (launch-time):
#   target                    (required)  module file or package directory to refactor
#   drag-model                (optional)  model for comprehensibility scoring (gremlins-drag --model)
#   instructions              (optional)  extra guidance injected into the per-iteration refactoring prompt
#   base_ref                  (optional)  git ref to check out for the isolated worktree (default: HEAD)
#   comprehensibility-estimates (optional)  number of LLM estimates per module (default: 5)
#
# NOTE: the bootstrap source is named `drag-model` (not `model`) because `model`
# collides with gremlins' own global --model flag.  Pass `--drag-model provider/model`
# to forward a model spec to gremlins-drag.
#
# How it works:
#   1. Baseline — run gremlins-drag once to capture the starting score.
#   2. Loop (max 5 iterations):
#      a. Refactor — an agent stage inspects the latest drag report (and,
#         from iteration 2 on, the report from before the last attempt)
#         and edits the target to reduce drag.
#      b. Commit — git add + commit in the isolated worktree.
#      c. Score + converge — run gremlins-drag on the refactored code.  If
#         the sum of drag did not improve, write a convergence marker
#         (stopping the loop early).  Otherwise update the tracking best.
#   3. Land — merge the worktree back into the main branch (manual via
#      `gremlins land`).

bootstrap:
  source:
    target:
      type: string
    drag-model:
      type: string
      optional: true
    instructions:
      type: string
      optional: true
    base_ref:
      type: string
      optional: true
    comprehensibility-estimates:
      type: string
      optional: true
    p:
      type: string
      optional: true
    skip-maintainability:
      type: string
      optional: true
  launch_cmds:
    - 'printf "%s" {target} > "$GREMLINS_STATE_DIR/artifacts/target.txt"'
    - 'printf "%s" {drag-model} > "$GREMLINS_STATE_DIR/artifacts/drag_model.txt"'
    - 'printf "%s" {instructions} > "$GREMLINS_STATE_DIR/artifacts/instructions.txt"'
    - 'printf "%s" {comprehensibility-estimates} > "$GREMLINS_STATE_DIR/artifacts/comp_estimates.txt"'
    - 'printf "%s" {p} > "$GREMLINS_STATE_DIR/artifacts/p.txt"'
    - 'printf "%s" {skip-maintainability} > "$GREMLINS_STATE_DIR/artifacts/skip_maint.txt"'
    - 'BASE_REF={base_ref} && SHA=$(git -C "$GREMLINS_PROJECT_ROOT" rev-parse --verify "${BASE_REF:-HEAD}") && git -C "$GREMLINS_PROJECT_ROOT" worktree add --detach "$GREMLIN_WORKDIR" "$SHA" && printf "%s" "$SHA" > "$GREMLINS_STATE_DIR/artifacts/base_sha"'
  cli_out:
    target: "artifact://target.txt"
    drag_model: "artifact://drag_model.txt"
    instructions: "artifact://instructions.txt"
    base_sha: "artifact://base_sha"
    comprehensibility_estimates: "artifact://comp_estimates.txt"
    p: "artifact://p.txt"
    skip_maintainability: "artifact://skip_maint.txt"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi
    export PATH="${GREMLINS_PROJECT_ROOT}/.gremlins/bin:${PATH}"

stages:
  # ── baseline ──────────────────────────────────────────────────────────
  - name: baseline
    type: exec
    interpolation:
      inputs:
        target: content("artifact://target.txt")
        drag_model: content("artifact://drag_model.txt")
        p: content("artifact://p.txt")
        skip_maintainability: content("artifact://skip_maint.txt")
        comprehensibility_estimates: content("artifact://comp_estimates.txt")
      outputs:
        report: "artifact://baseline/report.json"
        drag_best: "artifact://drag_best.txt"
    options:
      cmds:
        - |
          MODEL_ARG=""
          [ -n "{drag_model}" ] && MODEL_ARG="--model {drag_model}"
          EST="{comprehensibility_estimates}"
          [ -z "$EST" ] && EST=5
          P_ARG=""
          [ -n "{p}" ] && P_ARG="--p {p}"
          SKIP_MAINT=""
          [ -n "{skip_maintainability}" ] && SKIP_MAINT="--skip-maintainability"
          gremlins-drag --json --comprehensibility-estimates $EST {target} $MODEL_ARG $P_ARG $SKIP_MAINT > {report}
        - cp {report} "$GREMLINS_STATE_DIR/drag_current.json"
        - |
          cat {report} | python3 -c 'import json,sys; data=json.load(sys.stdin); pkgs=data.get("packages",[]); print(sum(p["drag"] for p in pkgs) if pkgs else sum(m["drag"] for m in data["modules"]))' > {drag_best}
        - 'echo "baseline sum drag = $(cat {drag_best})"'

  # ── drag curves (generated from current weights) ─────────────────────
  - name: curves
    type: exec
    interpolation:
      outputs:
        curves: "artifact://curves.txt"
    options:
      cmds:
        - gremlins-drag --curves > {curves}

  # ── optimize loop ─────────────────────────────────────────────────────
  - name: optimize
    type: sequence
    max-iterations: 5
    skip_if_exists: "artifact://converged"
    body:
      # --- prepare refactor context (latest report + previous, when available) ---
      - name: prepare-refactor-context
        type: exec
        interpolation:
          outputs:
            context: "artifact://{loop_iter}/refactor_context.md"
        options:
          cmds:
            - |
              STATE_DIR="$GREMLINS_STATE_DIR"
              {
                if [ -f "$STATE_DIR/drag_previous.json" ]; then
                  echo "## Drag report before the last refactor (previous state)"
                  echo '```json'
                  cat "$STATE_DIR/drag_previous.json"
                  echo '```'
                  echo ""
                fi
                echo "## Drag report after the last refactor (current state)"
                echo '```json'
                cat "$STATE_DIR/drag_current.json"
                echo '```'
              } > {context}

      # --- refactor ---
      - name: refactor
        type: agent
        interpolation:
          inputs:
            target: content("artifact://target.txt")
            drag_context: content("artifact://{loop_iter}/refactor_context.md")
            instructions: content("artifact://instructions.txt")
            curves: content("artifact://curves.txt")
          outputs:
            summary: "artifact://{loop_iter}/summary.md"
        prompt:
          - |
            Refactor the target at {target} to reduce its drag score.

            The reports below are the most recent drag analyses. The "current
            state" report describes the code you are about to edit. When a
            "previous state" report is present, it describes the code before the
            last refactor, so you can compare what changed and how drag moved.

            {drag_context}

            ## What drag means

            Module-level:
            drag(m) = (1+footprint)^w2 · exp(m·(1−comprehensibility))

            Package-level (only when the report includes a `packages` array):
            drag(p) = exp(p·(1−maint)) · Σ drag(m)   where Σ is over modules in package p

            The total minimized is the sum of drag across all items:
            - When packages are present: Σ drag(p) — each package's module-drag
              sum is multiplied by exp(p·(1−maint)) before summation.
            - When only modules are scored (no packages in the report):
              Σ drag(m) — no package multiplier applies.

            `footprint` is the total token count of every module transitively
            reachable from the module (including itself), so a module drags its
            whole downstream footprint with it. Higher drag means the module or
            package is harder to maintain and change.

            ## Drag curves (how each factor responds to change)

            {curves}

            ## How refactoring moves affect the score

            ### token_count
            Reducing a module's own token count directly lowers its footprint
            (since footprint includes the module itself) and may also reduce
            footprints of upstream modules that transitively depend on it.
            Smaller total code means less surface area for bugs and lower
            cognitive load. However, token_count alone is a small part of the
            total drag: the comprehensibility and package-maintainability
            multipliers can each amplify drag by up to ~12× (when m=2.5 or
            p=2.5). The footprint multiplier (1+footprint)^w2 is unbounded.

            ### footprint
            A module's footprint is the token sum of everything it transitively
            depends on. Breaking deep dependency chains, inlining small
            single-use helpers back into their callers, and avoiding unnecessary
            cross-module couplings all reduce footprint. When a module is
            refactored to depend on fewer other modules, its footprint
            shrinks — and every upstream module that depends on it may also
            benefit. Footprint enters the formula as (1+footprint)^w2; larger
            footprints amplify drag sub-linearly (w2=0.5 gives square-root
            growth).

            ### comprehensibility
            Comprehensibility is a multiplier on the footprint term:
            exp(m·(1−comp)). With m=2.5, a module with comp=0.5 faces a
            ~3.5× multiplier; at comp=0.1 it faces ~9.5×. Improving clarity, naming, control
            flow, data flow, or abstraction design all raise the
            comprehensibility score and shrink this multiplier. The effect is
            multiplicative with footprint, so improving comprehensibility on
            a high-footprint module yields more drag reduction than on a
            low-footprint one.

            ### package maintainability (only when `maint_score` is present)
            Package maintainability is scored on five dimensions (each 0–4):
            decomposition, interface_design, consistency, change_isolation,
            and duplication. The maint_score (0–1) is the sum of these five
            divided by 20. The package multiplier exp(p·(1−maint)) amplifies
            the sum of module drags within that package. Low maintainability
            can increase effective drag by up to exp(p). Improving any of the
            five dimensions — for example, extracting duplicated logic into
            shared helpers, isolating changes to fewer files, or tightening
            cross-module interfaces — raises maint_score and shrinks the
            package multiplier.

            ## Splitting vs merging modules

            Splitting one module into two can increase or decrease total drag
            depending on how the split affects each factor:

            - **token_count**: Splitting redistributes tokens across modules.
              Total token_count across the package may stay roughly the same
              (modulo any new imports, re-exports, or glue code).
            - **footprint**: Each half may still carry the same shared
              transitive dependencies. If module A imports module B, A's
              footprint includes B's tokens plus everything B depends on —
              so splitting can increase the sum of footprints even when total
              tokens are unchanged.
            - **comprehensibility**: Smaller, focused modules may be easier
              to understand (raising comp). Conversely, fragmentation across
              many files can obscure the overall design and force readers to
              jump between files (lowering comp). The net effect depends on
              whether the split creates clean conceptual boundaries or scatters
              related logic.
            - **package maintainability** (when packages are present): More
              modules may affect decomposition, change isolation, and
              duplication scores. A split that creates clean, independent
              boundaries can improve these dimensions. A split that scatters
              related logic across files can hurt them. When no packages are
              scored, this dimension does not apply.

            Example — splitting one module into two when both still share the
            same transitive dependencies:

            One module (2000 tokens, footprint 5000, comp 0.5, w2=0.5, m=2.5):
              drag = (1+5000)^0.5 · exp(2.5·0.5) ≈ 70.7 · 3.49 ≈ 246.8

            Split into A (1000 tokens) and B (1000 tokens), where A depends on B
            and both depend on shared downstream modules (3000 tokens beyond
            A/B themselves):
              drag(A) = (1+5000)^0.5 · exp(2.5·0.5) ≈ 70.7 · 3.49 ≈ 246.8
              drag(B) = (1+4000)^0.5 · exp(2.5·0.5) ≈ 63.3 · 3.49 ≈ 220.8
              total ≈ 467.6

            Here splitting increased total drag because both halves still carry
            the shared footprint. The outcome can differ when a split severs
            real dependency edges (reducing actual transitive reach) or when
            comprehensibility improves enough to offset the footprint penalty.

            Merging two modules reverses the analysis: footprint may decrease
            (fewer module-to-module edges), but comprehensibility may suffer if
            the result is a large, unfocused file. When packages are present,
            the net effect on package maintainability dimensions depends on
            whether the merge consolidates related logic or creates a monolithic
            blob. When no packages are scored, this dimension does not apply.
            ## Rules
            - Do NOT break correctness. After changes, verify the code still
              compiles / runs / imports cleanly (use whatever toolchain is available:
              `cargo check`, `python3 -m py_compile`, etc.).
            - Run tests if a test runner is available.
            - If no safe refactoring can reduce drag, say so clearly and explain why.
            - **Tests and drag:** `gremlins-drag` reads entire source files — it does
              NOT strip `#[cfg(test)]` modules or `tests/` directories. Every `.rs`
              file found under the target directory contributes tokens, deps/footprint,
              and comprehensibility. Moving tests out of a Rust module (e.g. from a
              `#[cfg(test)] mod tests` block into `tests/foo_test.rs`) does NOT
              reduce drag — it just redistributes it to another scored module.
              Removing or weakening tests that provide real coverage constitutes
              breaking correctness and is not allowed.
            - Write a concise summary of what you changed (or why you couldn't) to
              `{summary}`.

            ## Additional guidance
            {instructions}
        options:
          idle_timeout: 600

      - name: cleanup-build-artifacts
        type: exec
        options:
          cmds:
            - cargo clean 2>/dev/null || true
            - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            - find . -type f -name '*.pyc' -delete 2>/dev/null || true

      - name: commit
        type: exec
        options:
          cmds:
            - git add -A
            - |
              git diff --cached --quiet || git commit -m 'refactor: reduce drag (iter {loop_iter})'

      - name: require-progress
        type: exec
        interpolation:
          inputs:
            base_sha: content("artifact://base_sha")
        options:
          cmds:
            - git merge-base --is-ancestor "{base_sha}" HEAD
            - test `git rev-list --count "{base_sha}..HEAD"` -gt 0

      # --- score + convergence (after refactor, so the comparison is fair) ---
      - name: score-converge
        type: exec
        interpolation:
          inputs:
            target: content("artifact://target.txt")
            drag_model: content("artifact://drag_model.txt")
            p: content("artifact://p.txt")
            skip_maintainability: content("artifact://skip_maint.txt")
            comprehensibility_estimates: content("artifact://comp_estimates.txt")
            drag_best_val: content("artifact://drag_best.txt")
          outputs:
            report: "artifact://{loop_iter}/report.json"
            converged?: "artifact://converged"
        options:
          cmds:
            - |
              MODEL_ARG=""
              [ -n "{drag_model}" ] && MODEL_ARG="--model {drag_model}"
              EST="{comprehensibility_estimates}"
              [ -z "$EST" ] && EST=5
              P_ARG=""
              [ -n "{p}" ] && P_ARG="--p {p}"
              SKIP_MAINT=""
              [ -n "{skip_maintainability}" ] && SKIP_MAINT="--skip-maintainability"
              gremlins-drag --json --comprehensibility-estimates $EST {target} $MODEL_ARG $P_ARG $SKIP_MAINT > {report}
            - |
              STATE_DIR="$GREMLINS_STATE_DIR"
              if [ -f "$STATE_DIR/drag_current.json" ]; then
                cp "$STATE_DIR/drag_current.json" "$STATE_DIR/drag_previous.json"
              fi
              cp {report} "$STATE_DIR/drag_current.json"
            - |
              BEST="{drag_best_val}"
              [ -z "$BEST" ] && BEST=0
              CURR=$(cat {report} | python3 -c 'import json,sys; data=json.load(sys.stdin); pkgs=data.get("packages",[]); print(sum(p["drag"] for p in pkgs) if pkgs else sum(m["drag"] for m in data["modules"]))')
              if awk "BEGIN{exit !($CURR >= $BEST)}"; then
                touch {converged}
                echo "converged — drag $CURR >= best $BEST"
                printf "%s" "$BEST" > "$GREMLINS_STATE_DIR/artifacts/drag_best.txt"
                exit 1
              else
                rm -f {converged}
                printf "%s" "$CURR" > "$GREMLINS_STATE_DIR/artifacts/drag_best.txt"
                echo "improved — drag $CURR < $BEST (was $BEST)"
              fi

  # ── commit message ────────────────────────────────────────────────────
  - name: commit-message
    type: exec
    interpolation:
      inputs:
        target: content("artifact://target.txt")
        baseline_report: "artifact://baseline/report.json"
        drag_best_val: content("artifact://drag_best.txt")
      outputs:
        commit_message: "artifact://commit_message.txt"
    options:
      cmds:
        - |
          BEST="{drag_best_val}"
          [ -z "$BEST" ] && BEST="N/A"
          BASE_SUM=$(python3 -c 'import json,sys; data=json.load(sys.stdin); pkgs=data.get("packages",[]); print(round(sum(p["drag"] for p in pkgs) if pkgs else sum(m["drag"] for m in data["modules"]), 2))' < {baseline_report})
          {
            echo "drag-optimizer: reduce drag for {target}"
            echo ""
            echo "Baseline drag sum: $BASE_SUM \u2192 Best: $BEST"
            echo "Target: {target}"
          } > {commit_message}

land:
  interpolation:
    inputs:
      message: artifact://commit_message.txt
  land_cmds:
    - WORKTREE_HEAD=$(git -C "$GREMLIN_WORKDIR" rev-parse HEAD)
    - git merge --squash "$WORKTREE_HEAD"
    - 'git diff --cached --quiet || git commit -F "{message}"'
  clean_cmds:
    - git worktree remove --force "$GREMLIN_WORKDIR" || true
    - git worktree prune