# Drag score optimizer — iterative refactoring loop driven by gremlins-drag.
#
# Usage:
#   gremlins launch drag-optimizer --target crates/gremlins/src/lib.rs
#   gremlins launch drag-optimizer --target src/ --drag-model openai/gpt-4o
#   gremlins launch drag-optimizer --target my_pkg/ --instructions "focus on cyclomatic complexity"
#
# Parameters (launch-time):
#   target                    (required)  module file or package directory to refactor
#   drag-model                (optional)  model for comprehensibility scoring (gremlins-drag --model)
#   instructions              (optional)  extra guidance injected into the per-iteration refactoring prompt
#   base_ref                  (optional)  git ref to check out for the isolated worktree (default: HEAD)
#   comprehensibility-estimates (optional)  number of LLM estimates per module (default: 5)
#
# NOTE: the bootstrap source is named `drag-model` (not `model`) because `model`
# collides with gremlins' own global --model flag.  Pass `--drag-model provider/model`
# to forward a model spec to gremlins-drag.
#
# How it works:
#   1. Baseline — run gremlins-drag once to capture the starting score.
#   2. Loop (max 5 iterations):
#      a. Refactor — an agent stage inspects the latest drag report (and,
#         from iteration 2 on, the report from before the last attempt)
#         and edits the target to reduce drag.
#      b. Commit — git add + commit in the isolated worktree.
#      c. Score + converge — run gremlins-drag on the refactored code.  If
#         the sum of drag did not improve, write a convergence marker
#         (stopping the loop early).  Otherwise update the tracking best.
#   3. Land — merge the worktree back into the main branch (manual via
#      `gremlins land`).

bootstrap:
  source:
    target:
      type: string
    drag-model:
      type: string
      optional: true
    instructions:
      type: string
      optional: true
    base_ref:
      type: string
      optional: true
    comprehensibility-estimates:
      type: string
      optional: true
  launch_cmds:
    - 'printf "%s" {target} > "$GREMLINS_STATE_DIR/artifacts/target.txt"'
    - 'printf "%s" {drag-model} > "$GREMLINS_STATE_DIR/artifacts/drag_model.txt"'
    - 'printf "%s" {instructions} > "$GREMLINS_STATE_DIR/artifacts/instructions.txt"'
    - 'printf "%s" {comprehensibility-estimates} > "$GREMLINS_STATE_DIR/artifacts/comp_estimates.txt"'
    - 'BASE_REF={base_ref} && SHA=$(git -C "$GREMLINS_PROJECT_ROOT" rev-parse --verify "${BASE_REF:-HEAD}") && git -C "$GREMLINS_PROJECT_ROOT" worktree add --detach "$GREMLIN_WORKDIR" "$SHA" && printf "%s" "$SHA" > "$GREMLINS_STATE_DIR/artifacts/base_sha"'
  cli_out:
    target: "artifact://target.txt"
    drag_model: "artifact://drag_model.txt"
    instructions: "artifact://instructions.txt"
    base_sha: "artifact://base_sha"
    comprehensibility_estimates: "artifact://comp_estimates.txt"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi
    export PATH="${GREMLINS_PROJECT_ROOT}/.gremlins/bin:${PATH}"

stages:
  # ── baseline ──────────────────────────────────────────────────────────
  - name: baseline
    type: exec
    interpolation:
      inputs:
        target: content("artifact://target.txt")
        drag_model: content("artifact://drag_model.txt")
        comprehensibility_estimates: content("artifact://comp_estimates.txt")
      outputs:
        report: "artifact://baseline/report.json"
        drag_best: "artifact://drag_best.txt"
    options:
      cmds:
        - |
          MODEL_ARG=""
          [ -n "{drag_model}" ] && MODEL_ARG="--model {drag_model}"
          EST="{comprehensibility_estimates}"
          [ -z "$EST" ] && EST=5
          gremlins-drag --json --comprehensibility-estimates $EST {target} $MODEL_ARG > {report}
        - cp {report} "$GREMLINS_STATE_DIR/drag_current.json"
        - |
          cat {report} | python3 -c 'import json,sys; data=json.load(sys.stdin); print(sum(m["drag"] for m in data["modules"]))' > {drag_best}
        - 'echo "baseline sum drag = $(cat {drag_best})"'

  # ── drag curves (generated from current weights) ─────────────────────
  - name: curves
    type: exec
    interpolation:
      outputs:
        curves: "artifact://curves.txt"
    options:
      cmds:
        - gremlins-drag --curves > {curves}

  # ── optimize loop ─────────────────────────────────────────────────────
  - name: optimize
    type: sequence
    max-iterations: 5
    skip_if_exists: "artifact://{loop_iter}/converged"
    body:
      # --- prepare refactor context (latest report + previous, when available) ---
      - name: prepare-refactor-context
        type: exec
        interpolation:
          outputs:
            context: "artifact://{loop_iter}/refactor_context.md"
        options:
          cmds:
            - |
              STATE_DIR="$GREMLINS_STATE_DIR"
              {
                if [ -f "$STATE_DIR/drag_previous.json" ]; then
                  echo "## Drag report before the last refactor (previous state)"
                  echo '```json'
                  cat "$STATE_DIR/drag_previous.json"
                  echo '```'
                  echo ""
                fi
                echo "## Drag report after the last refactor (current state)"
                echo '```json'
                cat "$STATE_DIR/drag_current.json"
                echo '```'
              } > {context}

      # --- refactor ---
      - name: refactor
        type: agent
        interpolation:
          inputs:
            target: content("artifact://target.txt")
            drag_context: content("artifact://{loop_iter}/refactor_context.md")
            instructions: content("artifact://instructions.txt")
            curves: content("artifact://curves.txt")
          outputs:
            summary: "artifact://{loop_iter}/summary.md"
        prompt:
          - |
            Refactor the target at {target} to reduce its drag score.

            The reports below are the most recent drag analyses. The "current
            state" report describes the code you are about to edit. When a
            "previous state" report is present, it describes the code before the
            last refactor, so you can compare what changed and how drag moved.

            {drag_context}

            ## What drag means
            drag = (1+footprint)^w2 · exp(2.5·(1−comprehensibility))

            Higher drag = the module is harder to maintain and change. The optimizer
            minimizes the **sum** of drag across all scored modules — not any
            single module in isolation. `footprint` is the total token count of
            every module transitively reachable from the module (including itself),
            so a module drags its whole downstream footprint with it.

            ## Drag curves (how each factor responds to change)

            {curves}

            ## Strategy
            1. **Reduce token_count** — extract helpers, deduplicate, trim boilerplate,
               remove dead code.
            2. **Lower footprint** — decouple cross-cutting concerns and avoid
               deep dependency chains; every downstream token counts against the
               modules that reach it (including the module itself).
            3. **Improve comprehensibility** — clearer names, simpler control flow,
               better documentation where it aids understanding. The penalty is
               multiplicative: low comprehensibility scales the whole footprint by
               up to exp(2.5) ≈ 12.2.

            ### Splitting trap (CRITICAL)
            Splitting one module into two usually INCREASES total drag because
            each piece still carries the shared transitive footprint:

            One module (2000 tokens, footprint 5000, comp 0.5, w2=0.5, m=2.5):
              drag = (1+5000)^0.5 · exp(2.5·0.5) ≈ 70.7 · 3.49 ≈ 246.8

            Split into A (1000 tokens) and B (1000 tokens), where A depends on B
            and both still depend on the shared downstream modules (3000 tokens
            beyond A/B themselves):
              drag(A) = (1+5000)^0.5 · exp(2.5·0.5) ≈ 70.7 · 3.49 ≈ 246.8
              drag(B) = (1+4000)^0.5 · exp(2.5·0.5) ≈ 63.3 · 3.49 ≈ 220.8
              total ≈ 467.6

            → Splitting increased drag even though token_count was unchanged, because
              both halves still carry the shared footprint. Only split if the
              resulting modules are dramatically smaller, more comprehensible, or
              sever real dependency edges. Prefer inlining, deduplication, and
              dead-code removal over splitting.

            ## Rules
            - Do NOT break correctness. After changes, verify the code still
              compiles / runs / imports cleanly (use whatever toolchain is available:
              `cargo check`, `python3 -m py_compile`, etc.).
            - Run tests if a test runner is available.
            - If no safe refactoring can reduce drag, say so clearly and explain why.
            - **Tests and drag:** `gremlins-drag` reads entire source files — it does
              NOT strip `#[cfg(test)]` modules or `tests/` directories. Every `.rs`
              file found under the target directory contributes tokens, deps/footprint,
              and comprehensibility. Moving tests out of a Rust module (e.g. from a
              `#[cfg(test)] mod tests` block into `tests/foo_test.rs`) does NOT
              reduce drag — it just redistributes it to another scored module.
              Removing or weakening tests that provide real coverage constitutes
              breaking correctness and is not allowed.
            - Write a concise summary of what you changed (or why you couldn't) to
              `{summary}`.

            ## Additional guidance
            {instructions}
        options:
          idle_timeout: 600

      - name: cleanup-build-artifacts
        type: exec
        options:
          cmds:
            - cargo clean 2>/dev/null || true
            - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            - find . -type f -name '*.pyc' -delete 2>/dev/null || true

      - name: commit
        type: exec
        options:
          cmds:
            - git add -A
            - |
              git diff --cached --quiet || git commit -m 'refactor: reduce drag (iter {loop_iter})'

      - name: require-progress
        type: exec
        interpolation:
          inputs:
            base_sha: content("artifact://base_sha")
        options:
          cmds:
            - git merge-base --is-ancestor "{base_sha}" HEAD
            - test `git rev-list --count "{base_sha}..HEAD"` -gt 0

      # --- score + convergence (after refactor, so the comparison is fair) ---
      - name: score-converge
        type: exec
        interpolation:
          inputs:
            target: content("artifact://target.txt")
            drag_model: content("artifact://drag_model.txt")
            comprehensibility_estimates: content("artifact://comp_estimates.txt")
            drag_best_val: content("artifact://drag_best.txt")
          outputs:
            report: "artifact://{loop_iter}/report.json"
            converged?: "artifact://{loop_iter}/converged"
        options:
          cmds:
            - |
              MODEL_ARG=""
              [ -n "{drag_model}" ] && MODEL_ARG="--model {drag_model}"
              EST="{comprehensibility_estimates}"
              [ -z "$EST" ] && EST=5
              gremlins-drag --json --comprehensibility-estimates $EST {target} $MODEL_ARG > {report}
            - |
              STATE_DIR="$GREMLINS_STATE_DIR"
              if [ -f "$STATE_DIR/drag_current.json" ]; then
                cp "$STATE_DIR/drag_current.json" "$STATE_DIR/drag_previous.json"
              fi
              cp {report} "$STATE_DIR/drag_current.json"
            - |
              BEST="{drag_best_val}"
              [ -z "$BEST" ] && BEST=0
              CURR=$(cat {report} | python3 -c 'import json,sys; data=json.load(sys.stdin); print(sum(m["drag"] for m in data["modules"]))')
              if awk "BEGIN{exit !($CURR >= $BEST)}"; then
                touch {converged}
                echo "converged — drag $CURR >= best $BEST"
                printf "%s" "$BEST" > "$GREMLINS_STATE_DIR/artifacts/drag_best.txt"
              else
                printf "%s" "$CURR" > "$GREMLINS_STATE_DIR/artifacts/drag_best.txt"
                echo "improved — drag $CURR < $BEST (was $BEST)"
              fi

  # ── commit message ────────────────────────────────────────────────────
  - name: commit-message
    type: exec
    interpolation:
      inputs:
        target: content("artifact://target.txt")
        baseline_report: "artifact://baseline/report.json"
        drag_best_val: content("artifact://drag_best.txt")
      outputs:
        commit_message: "artifact://commit_message.txt"
    options:
      cmds:
        - |
          BEST="{drag_best_val}"
          [ -z "$BEST" ] && BEST="N/A"
          BASE_SUM=$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(round(sum(m["drag"] for m in data["modules"]), 2))' < {baseline_report})
          {
            echo "drag-optimizer: reduce drag for {target}"
            echo ""
            echo "Baseline drag sum: $BASE_SUM \u2192 Best: $BEST"
            echo "Target: {target}"
          } > {commit_message}

land:
  interpolation:
    inputs:
      message: artifact://commit_message.txt
  land_cmds:
    - WORKTREE_HEAD=$(git -C "$GREMLIN_WORKDIR" rev-parse HEAD)
    - git merge --squash "$WORKTREE_HEAD"
    - 'git diff --cached --quiet || git commit -F "{message}"'
  clean_cmds:
    - git worktree remove --force "$GREMLIN_WORKDIR" || true
    - git worktree prune