prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: [filepath, string]
      optional: true
    base_ref:
      type: string
      optional: true
  launch_cmds:
    - '[ -n "{instructions}" ] || [ -n "{plan}" ] || { echo "ERROR: at least one of --instructions or --plan is required" >&2; exit 1; }'
    - gremlins:bind_artifact("artifact://plan.md", plan)
    - gremlins:bind_artifact("artifact://instructions.txt", instructions)
    - gremlins:bind_artifact("artifact://base_ref", base_ref)
    - 'BASE_REF={base_ref} && SHA=$(git -C "$GREMLINS_PROJECT_ROOT" rev-parse --verify "${BASE_REF:-HEAD}") && git -C "$GREMLINS_PROJECT_ROOT" worktree add --detach "$GREMLIN_WORKDIR" "$SHA" && echo "$SHA" > "$GREMLINS_STATE_DIR/artifacts/base_sha"'
  cli_out:
    base_sha: "artifact://base_sha"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    export CARGO_INCREMENTAL=0
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi
    export PREFIX="${GREMLINS_SCRATCH_DIR}/install"
    export PATH="${GREMLINS_PROJECT_ROOT}/.gremlins/bin:${PATH}"

land:
  interpolation:
    inputs:
      pr_url: content("artifact://pr-url.txt")
  options:
    cmds:
      - git worktree remove --force "$GREMLIN_WORKDIR" || true
      - git worktree prune
      - gh pr merge --squash --delete-branch "{pr_url}"
      - git fetch origin
      - git branch -f main origin/main 2>/dev/null || git merge --ff-only origin/main

stage-definitions:
  plan-gh: plan-gh
  github-open-pr: github-open-pr
  github-request-copilot-review: github-request-copilot-review
  github-wait-copilot: github-wait-copilot
  github-wait-ci: github-wait-ci
  github-push-to-pr-branch: github-push-to-pr-branch
  check-and-fix:
    type: sequence
    body:
      - name: format
        type: exec
        options:
          timeout: 300
          cmds:
            - make autoformat || true
            - git add -A
            - git diff --cached --quiet || git commit -m 'format'

      - name: verify
        type: verify
        options:
          cmds:
            - "make -j8 check && make -j8 test"
          max_iterations: 7
        prompt: [style_guide.md, dev-env-howto.md, verify_fix.md]
      - name: commit
        type: exec
        options:
          cmds:
            - git add -A
            - git diff --cached --quiet || git commit -m "fix checks"

stages:
  - { name: plan, type: plan-gh, prompt: [style_guide.md, plan_gh.md] }
  - { name: implement, type: implement, prompt: [task-guide.md, style_guide.md, dev-env-howto.md, implement.md] }
  - { name: verify-implementation, type: check-and-fix }

  - name: compute-diff
    type: exec
    interpolation:
      inputs:
        base_sha: content("artifact://base_sha")
      outputs:
        diff: "artifact://diff.txt"
    options:
      cmds:
        - "git diff {base_sha}...HEAD > {diff}"

  - type: parallel
    fork:
      cmds:
        - git worktree add --detach "$GREMLIN_FORK_WORKDIR" HEAD
    body:
      - name: review-one
        type: agent
        interpolation:
          inputs:
            plan: content("artifact://plan.md")
            diff: content("artifact://diff.txt")
          outputs:
            filepath: "artifact://review-one.md"
        prompt: [review.md]
      - name: review-two
        type: agent
        interpolation:
          inputs:
            plan: content("artifact://plan.md")
            diff: content("artifact://diff.txt")
          outputs:
            filepath: "artifact://review-two.md"
        prompt: [review.md]

  - name: address
    type: agent
    prompt: [style_guide.md, dev-env-howto.md, address.md]
    interpolation:
      inputs:
        plan: content("artifact://plan.md")
        diff: content("artifact://diff.txt")
        review_one: content("artifact://review-one.md")
        review_two: content("artifact://review-two.md")
      outputs:
        address_summary: "artifact://address-summary.md"

  - { name: verify-address-fixes, type: check-and-fix }
  - { name: open-pr, type: github-open-pr }
  - { name: request-copilot-review, type: github-request-copilot-review }
  - { name: wait-for-copilot, type: github-wait-copilot }
  - name: gather-github-review-content
    type: exec
    interpolation:
      inputs:
        pr: content("artifact://pr-url.txt")
      outputs:
        github_review_content: "artifact://github-review-content.md"
    options:
      cmds:
        - 'gh_gather_review_content "{pr}" > "{github_review_content}"'
  - name: github-address-pull-request-reviews
    type: agent
    interpolation:
      inputs:
        pr: content("artifact://pr-url.txt")
        content: content("artifact://github-review-content.md")
      outputs:
        review_summary: "artifact://review-summary.md"
    prompt: [style_guide.md, dev-env-howto.md, github_address_pull_request_reviews.md]
  - { name: verify-github-review-fixes, type: check-and-fix }
  - { name: push-review-fixes, type: github-push-to-pr-branch }
  - { name: wait-for-ci, type: github-wait-ci, prompt: [style_guide.md, dev-env-howto.md, ci_fix.md] }
