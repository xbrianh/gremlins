base_ref: main
prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: [filepath, string]
      optional: true
  launch_cmds:
    - gremlins:bind_artifact("artifact://plan.md", plan)
    - gremlins:bind_artifact("artifact://instructions.txt", instructions)
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    unset VIRTUAL_ENV UV_PYTHON UV_PROJECT_ENVIRONMENT UV_SYSTEM_PYTHON PYTHONPATH
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi
    export VIRTUAL_ENV="${GREMLINS_WORKTREE_PATH}/.venv"
    export UV_PROJECT_ENVIRONMENT="${GREMLINS_WORKTREE_PATH}/.venv"
    export PATH="${GREMLINS_WORKTREE_PATH}/.venv/bin:${PATH}"

land:
  interpolation:
    PR_URL: content("artifact://pr-url.txt")
  options:
    cmds:
      - gh pr merge --squash --delete-branch "$PR_URL"
      - git fetch origin
      - git branch -f main origin/main 2>/dev/null || git merge --ff-only origin/main

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  dev-env: dev-env-howto.md
  review: review.md

stage-definitions:
  plan-gh: plan-gh
  github-open-pr: github-open-pr
  github-request-copilot-review: github-request-copilot-review
  github-wait-copilot: github-wait-copilot
  github-wait-ci: github-wait-ci
  check-and-fix:
    type: sequence
    body:
      - name: format
        type: exec
        options:
          timeout: 300
          cmds:
            - make autoformat || true
            - git add -A
            - git diff --cached --quiet || git commit -m 'format'

      - name: verify
        type: verify
        options:
          cmds:
            - "make -j8 check && make -j8 test"
          max_iterations: 7
        prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
      - name: commit
        type: exec
        options:
          cmds:
            - git add -A
            - git diff --cached --quiet || git commit -m "fix checks"

stages:
  - { type: plan-gh, prompt: [code-style, terse, plan_gh.md] }
  - { type: gremlins:implement, prompt: [code-style, terse, dev-env, no_lint_in_implement.md, implement_gh.md] }
  - { type: check-and-fix }

  - name: compute-diff
    type: exec
    interpolation:
      base_sha: content("artifact://base_sha")
    bind:
      diff: "artifact://diff.txt"
    options:
      cmds:
        - "git diff {base_sha}...HEAD > \"$GREMLINS_ARTIFACT_DIR/diff.txt\""

  - parallel:
      - name: review-one
        type: agent
        interpolation:
          plan: content("artifact://plan.md")
          diff: content("artifact://diff.txt")
        prompt: [code-style, terse, dev-env, review]
        bind:
          filepath: "artifact://review-one.md"
      - name: review-two
        type: agent
        interpolation:
          plan: content("artifact://plan.md")
          diff: content("artifact://diff.txt")
        prompt: [code-style, terse, dev-env, review]
        bind:
          filepath: "artifact://review-two.md"

  - name: address
    type: agent
    prompt: [code-style, terse, dev-env, address.md, no_lint_in_implement.md, gremlins:bail_section.md]
    interpolation:
      review_one: content("artifact://review-one.md")
      review_two: content("artifact://review-two.md")

  - { type: check-and-fix }
  - { type: github-open-pr }
  - { type: github-request-copilot-review }
  - { type: github-wait-copilot }
  - name: gather-github-review-content
    type: exec
    interpolation:
      pr: content("artifact://pr-url.txt")
    bind:
      github_review_content: "artifact://github-review-content.md"
    options:
      cmds:
        - |
          set -e
          set -o pipefail
          PR_URL="{pr}"
          PR_NUMBER="$(gh pr view "$PR_URL" --json number --jq '.number')"
          OWNER_REPO="$(echo "$PR_URL" | sed 's|https://github.com/||; s|/pull/.*||')"
          PR_TITLE="$(gh pr view "$PR_URL" --json title --jq '.title')"
          PR_BODY="$(gh pr view "$PR_URL" --json body --jq '.body')"
          PR_AUTHOR="$(gh pr view "$PR_URL" --json author --jq '.author.login')"
          PR_HEAD_REF="$(gh pr view "$PR_URL" --json headRefName --jq '.headRefName')"
          PR_BASE_REF="$(gh pr view "$PR_URL" --json baseRefName --jq '.baseRefName')"
          {
            echo "# PR Review Comments"
            echo
            echo "**PR:** $PR_URL"
            echo "**Number:** #$PR_NUMBER"
            echo "**Title:** $PR_TITLE"
            echo "**Author:** $PR_AUTHOR"
            echo "**Branch:** $PR_HEAD_REF → $PR_BASE_REF"
            echo "**Owner/Repo:** $OWNER_REPO"
            echo
            if [ -n "$PR_BODY" ] && [ "$PR_BODY" != "null" ]; then
              echo "## PR Description"
              echo
              echo "$PR_BODY"
              echo
            fi
            echo "## Review Comments"
            echo
            gh api "repos/$OWNER_REPO/pulls/$PR_NUMBER/comments" --paginate --jq '.[] | "### Comment \(.id) by \(.user.login)\n\n\(.body)\n\n_File: `\(.path):\(.line // .original_line)`_\n\n---\n"'
            echo
            echo "## Issue Comments"
            echo
            gh pr view "$PR_URL" --comments --json comments --jq '.comments[] | "### Comment by \(.author.login) (\(.createdAt))\n\n\(.body)\n\n---\n"'
          } > "$GREMLINS_ARTIFACT_DIR/github-review-content.md"
  - name: github-address-pull-request-reviews
    type: agent
    interpolation:
      pr: content("artifact://pr-url.txt")
      content: content("artifact://github-review-content.md")
    prompt:
      - code-style
      - terse
      - dev-env
      - github_address_pull_request_reviews.md
      - gremlins:bail_section.md
  - { type: check-and-fix }
  - { type: github-wait-ci, prompt: [terse, dev-env, gremlins:ci_fix.md, gremlins:bail_section_fix.md] }
