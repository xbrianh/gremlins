base_ref: current
prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: filepath
      optional: true
  launch_cmds:
    - '[ -n "{instructions}" ] || [ -n "{plan}" ] || { echo "ERROR: at least one of --instructions or --plan is required" >&2; exit 1; }'
    - gremlins:bind_artifact("artifact://plan.md", plan)
    - gremlins:bind_artifact("artifact://instructions.txt", instructions)
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${GREMLINS_PROJECT_ROOT}/.cargo-gremlin-target}"
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi

land:
  interpolation:
    message: artifact://commit_message.txt
  options:
    cmds:
      - WORKTREE_HEAD=$(git -C "$GREMLINS_WORKTREE_PATH" rev-parse HEAD)
      - git merge --squash "$WORKTREE_HEAD"
      - 'git diff --cached --quiet || git commit -F "{message}"'

stage-definitions:
  check-and-fix:
    type: sequence
    body:
      - name: format
        type: exec
        options:
          timeout: 300
          cmds:
            - make autoformat || true
            - git add -A
            - git diff --cached --quiet || git commit -m 'format'

      - name: verify
        type: verify
        options:
          cmds:
            - "make -j8 check && make -j8 test"
          max_iterations: 7
        prompt: [style_guide.md, dev-env-howto.md, verify_fix.md]
      - name: commit
        type: exec
        options:
          cmds:
            - git add -A
            - git diff --cached --quiet || git commit -m "fix checks"

stages:
  - { type: gremlins:plan,      prompt: [style_guide.md, plan.md] }
  - { type: gremlins:implement,  prompt: [task-guide.md, style_guide.md, dev-env-howto.md, implement.md] }
  - { type: check-and-fix }
  - name: compute-diff
    type: exec
    interpolation:
      base_sha: content("artifact://base_sha")
    bind:
      diff: "artifact://diff.txt"
    options:
      cmds:
        - "git diff {base_sha}...HEAD > {diff}"
  - parallel:
      - name: review-one
        type: agent
        interpolation:
          plan: content("artifact://plan.md")
          diff: content("artifact://diff.txt")
        prompt: [review.md]
        bind:
          filepath: "artifact://review-one.md"
      - name: review-two
        type: agent
        interpolation:
          plan: content("artifact://plan.md")
          diff: content("artifact://diff.txt")
        prompt: [review.md]
        bind:
          filepath: "artifact://review-two.md"
  - name: address
    type: agent
    prompt: [style_guide.md, dev-env-howto.md, address.md]
    interpolation:
      plan: content("artifact://plan.md")
      diff: content("artifact://diff.txt")
      review_one: content("artifact://review-one.md")
      review_two: content("artifact://review-two.md")
    bind:
      address_summary: "artifact://address-summary.md"
  - { type: check-and-fix }
  - name: commit-message
    type: agent
    prompt: [commit_message.md]
    interpolation:
      plan: content("artifact://plan.md")
      diff: content("artifact://diff.txt")
      address_summary: content("artifact://address-summary.md")
    bind:
      commit_message: "artifact://commit_message.txt"
