prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: filepath
      optional: true
    base_ref:
      type: string
      optional: true
  launch_cmds:
    - '[ -n "{instructions}" ] || [ -n "{plan}" ] || { echo "ERROR: at least one of --instructions or --plan is required" >&2; exit 1; }'
    - gremlins:bind_artifact("artifact://plan.md", plan)
    - gremlins:bind_artifact("artifact://instructions.md", instructions)
    - gremlins:bind_artifact("artifact://base_ref", base_ref)
    - 'BASE_REF={base_ref} && SHA=$(git -C "$GREMLINS_PROJECT_ROOT" rev-parse --verify "${BASE_REF:-HEAD}") && git -C "$GREMLINS_PROJECT_ROOT" worktree add --detach "$GREMLIN_WORKDIR" "$SHA" && echo "$SHA" > "$GREMLINS_STATE_DIR/artifacts/base_sha"'
  cli_out:
    base_sha: "artifact://base_sha"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${GREMLINS_PROJECT_ROOT}/.cargo-gremlin-target}"
    export CARGO_INCREMENTAL=0
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi
    export PREFIX="${GREMLINS_SCRATCH_DIR}/install"

land:
  interpolation:
    inputs:
      message: artifact://commit_message.txt
  land_cmds:
    - WORKTREE_HEAD=$(git -C "$GREMLIN_WORKDIR" rev-parse HEAD)
    - git merge --squash "$WORKTREE_HEAD"
    - 'git diff --cached --quiet || git commit -F "{message}"'
  clean_cmds:
    - git worktree remove --force "$GREMLIN_WORKDIR" || true
    - git worktree prune

stage-definitions:
  check-and-fix:
    type: sequence
    body:
      - name: format
        type: exec
        options:
          timeout: 300
          cmds:
            - make autoformat || true
            - git add -A
            - git diff --cached --quiet || git commit -m 'format'

      - name: verify
        type: verify
        options:
          cmds:
            - "make -j8 check && make -j8 test"
          max_iterations: 7
        prompt: [style_guide.md, dev-env-howto.md, verify_fix.md]
      - name: commit
        type: exec
        options:
          cmds:
            - git add -A
            - git diff --cached --quiet || git commit -m "fix checks"

stages:
  - { name: plan, type: plan, prompt: [style_guide.md, plan.md] }
  - { name: implement, type: implement, prompt: [task-guide.md, style_guide.md, dev-env-howto.md, implement.md] }
  - { name: verify-implementation, type: check-and-fix }
  - name: compute-diff
    type: exec
    interpolation:
      inputs:
        base_sha: content("artifact://base_sha")
      outputs:
        diff: "artifact://diff.txt"
    options:
      cmds:
        - "git diff {base_sha}...HEAD > {diff}"
  - type: parallel
    fork:
      cmds:
        - git worktree add --detach "$GREMLIN_FORK_WORKDIR" HEAD
    body:
      - name: review-one
        type: agent
        interpolation:
          inputs:
            plan: content("artifact://plan.md")
            diff: content("artifact://diff.txt")
          outputs:
            filepath: "artifact://review-one.md"
        prompt: [review.md]
      - name: review-two
        type: agent
        interpolation:
          inputs:
            plan: content("artifact://plan.md")
            diff: content("artifact://diff.txt")
          outputs:
            filepath: "artifact://review-two.md"
        prompt: [review.md]
  - name: address
    type: agent
    prompt: [style_guide.md, dev-env-howto.md, address.md]
    interpolation:
      inputs:
        plan: content("artifact://plan.md")
        diff: content("artifact://diff.txt")
        review_one: content("artifact://review-one.md")
        review_two: content("artifact://review-two.md")
      outputs:
        address_summary: "artifact://address-summary.md"
  - { name: verify-address-fixes, type: check-and-fix }
  - name: commit-message
    type: agent
    prompt: [commit_message.md]
    interpolation:
      inputs:
        plan: content("artifact://plan.md")
        diff: content("artifact://diff.txt")
        address_summary: content("artifact://address-summary.md")
      outputs:
        commit_message: "artifact://commit_message.txt"
