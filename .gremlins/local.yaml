base_ref: current
prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: filepath
      optional: true
  launch_cmds:
    - '[ -n "{instructions}" ] || [ -n "{plan}" ] || { echo "ERROR: at least one of --instructions or --plan is required" >&2; exit 1; }'
    - gremlins:bind_artifact("artifact://plan.md", plan)
    - gremlins:bind_artifact("artifact://instructions.txt", instructions)
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    unset VIRTUAL_ENV UV_PYTHON UV_PROJECT_ENVIRONMENT UV_SYSTEM_PYTHON PYTHONPATH
    export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${GREMLINS_PROJECT_ROOT}/.cargo-gremlin-target}"
    if command -v sccache &>/dev/null; then
        export RUSTC_WRAPPER="${RUSTC_WRAPPER:-sccache}"
    fi
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi
    export VIRTUAL_ENV="${GREMLINS_WORKTREE_PATH}/.venv"
    export UV_PROJECT_ENVIRONMENT="${GREMLINS_WORKTREE_PATH}/.venv"
    export PATH="${GREMLINS_WORKTREE_PATH}/.venv/bin:${PATH}"

stage-definitions:
  check-and-fix:
    type: sequence
    body:
      - name: format
        type: exec
        options:
          timeout: 300
          cmds:
            - make autoformat || true
            - git add -A
            - git diff --cached --quiet || git commit -m 'format'

      - name: verify
        type: verify
        options:
          cmds:
            - "make -j8 check && make -j8 test"
          max_iterations: 7
        prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
      - name: commit
        type: exec
        options:
          cmds:
            - git add -A
            - git diff --cached --quiet || git commit -m "fix checks"

stages:
  - { type: gremlins:plan,      prompt: [style_guide.md, gremlins:plan.md] }
  - { type: gremlins:implement,  prompt: [style_guide.md, dev-env-howto.md, no_lint_in_implement.md, gremlins:implement_local.md] }
  - { type: check-and-fix }
  - name: compute-diff
    type: exec
    interpolation:
      base_sha: content("artifact://base_sha")
    bind:
      diff: "artifact://diff.txt"
    options:
      cmds:
        - "git diff {base_sha}...HEAD > {diff}"
  - parallel:
      - name: review-one
        type: agent
        interpolation:
          plan: content("artifact://plan.md")
          diff: content("artifact://diff.txt")
        prompt: [style_guide.md, dev-env-howto.md, review.md]
        bind:
          filepath: "artifact://review-one.md"
      - name: review-two
        type: agent
        interpolation:
          plan: content("artifact://plan.md")
          diff: content("artifact://diff.txt")
        prompt: [style_guide.md, dev-env-howto.md, review.md]
        bind:
          filepath: "artifact://review-two.md"
  - name: address
    type: agent
    prompt: [style_guide.md, dev-env-howto.md, address.md, no_lint_in_implement.md, gremlins:bail_section.md]
    interpolation:
      review_one: content("artifact://review-one.md")
      review_two: content("artifact://review-two.md")
  - { type: check-and-fix }
