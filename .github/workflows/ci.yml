name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create venv and install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Build and install native extension
        run: |
          source .venv/bin/activate
          rm -f target/wheels/gremlins_ai-*.whl
          maturin build --profile ci
          pip install --force-reinstall target/wheels/gremlins_ai-*.whl
      - name: Validate pipeline overlays
        run: |
          source .venv/bin/activate
          make validate-gremlin-overlays
      - name: Lint, format, type-check, clippy, rustfmt
        run: |
          source .venv/bin/activate
          make check
      - name: Test (Rust + Python)
        run: |
          source .venv/bin/activate
          make test
      - name: Test GitHub integration scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats
          make test-github-integration-scripts
