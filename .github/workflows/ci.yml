name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Check (fmt + clippy + compile)
        run: make check
      - name: Test (Rust)
        run: make test
      - name: Test (Overlay Tools)
        run: make test-overlay-tools
      - name: Validate Gremlin Definitions
        run: make validate-gremlin-definitions
        env:
          GREMLINS_DEFAULT_CLIENT: cmd:true
