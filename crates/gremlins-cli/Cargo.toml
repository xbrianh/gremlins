[package]
name = "gremlins-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gremlins"
path = "src/main.rs"

[dependencies]
gremlins = { path = "../gremlins" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
serde_yaml = "0.9"
libc = "0.2"
env_logger = "0.11"
log = "0.4"