[package]
name = "gremlins-pyext"
version = "0.0.0"
edition = "2021"

[lib]
name = "gremlins_pyext"
crate-type = ["cdylib", "rlib"]

[dependencies]
gremlins = { path = "../gremlins" }
pyo3 = { version = "0.29", features = ["indexmap"] }
pyo3-log = "0.13"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["process", "time", "rt", "sync", "io-util", "macros"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
indexmap = "2"
rig-core = { version = "0.41", features = ["derive"] }
log = "0.4"

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[features]
extension-module = ["pyo3/extension-module"]
