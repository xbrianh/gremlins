[package]
name = "gremlins"
version = "0.0.0"
edition = "2021"

[lib]
name = "gremlins"
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["process", "time", "rt", "sync", "io-util", "macros"] }
shlex = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
futures = "0.3"
glob = "0.3"
http = "1"
indexmap = "2"
rig-core = { version = "0.41", features = ["derive"] }
thiserror = "2"
log = "0.4"
dirs = "6"
phf = { version = "0.11", features = ["macros"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
rig-core = { version = "0.41", features = ["test-utils"] }
