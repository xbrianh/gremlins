[package]
name = "gremlins"
version = "0.0.0"
edition = "2021"

[lib]
name = "gremlins"
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["process", "time", "rt", "sync", "io-util", "macros"] }
shlex = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
futures = "0.3"
glob = "0.3"
http = "1"
indexmap = { version = "2", features = ["serde"] }
rig-core = { version = ">=0.43", features = ["derive"] }
bytes = "1"
azure_identity = { version = "=1.1.0-beta.1", default-features = false, features = ["tokio", "reqwest_rustls"] }
azure_core = "1.2.0-beta.1"
thiserror = "2"
log = "0.4"
dirs = "6"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
rig-core = { version = ">=0.43", features = ["test-utils"] }
