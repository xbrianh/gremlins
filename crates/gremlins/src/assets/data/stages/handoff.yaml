stages:
  - type: sequence
    body:
      - name: detach-prior-pr
        type: exec
        bind:
          pr_branch?: "artifact://pr-branch.txt"
        options:
          cmds:
            - |
              if [ -f "{pr_branch}" ]; then
                branch="$(cat "{pr_branch}")"
                if [ -n "$branch" ]; then
                  git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" && git checkout --detach "origin/$branch"
                fi
              fi
      - name: handoff-init
        type: exec
        skip_if_exists: "artifact://rolling-plan.md"
        interpolation:
          plan: "artifact://plan.md"
        bind:
          rolling_plan: "artifact://rolling-plan.md"
          boss_spec: "artifact://boss-spec.md"
        options:
          cmds:
            - |
              if [ ! -f "{boss_spec}" ]; then
                cp "{plan}" "{boss_spec}"
              fi
              if [ ! -f "{rolling_plan}" ]; then
                cp "{plan}" "{rolling_plan}"
              fi

      - name: handoff
        type: agent
        prompt:
          - "gremlins:handoff.md"
          - "gremlins:code_style.md"
        interpolation:
          plan_text: content("artifact://rolling-plan.md")
          spec_section: content("artifact://boss-spec.md")?
          rolling_plan: artifact://rolling-plan.md
        bind:
          child_plan?: "artifact://{loop_iter}/child-plan.md"
          signal:       "artifact://{loop_iter}/signal.json"
        options:
          idle_timeout: 3600

      - name: translate-signal
        type: exec
        interpolation:
          signal: artifact://{loop_iter}/signal.json
          rolling_plan: artifact://rolling-plan.md
          child_plan: artifact://{loop_iter}/child-plan.md?
          boss_spec: "artifact://boss-spec.md"
        bind:
          bail?: "artifact://{loop_iter}/bail"
          done?: "artifact://{loop_iter}/done"
          rolling_plan_pre: "artifact://rolling-plan-pre-sanitize.md"
          plan: "artifact://plan.md"
        options:
          cmds:
            - |
              SIGNAL="{signal}"
              ROLLING="{rolling_plan}"

              cp "$ROLLING" "{rolling_plan_pre}"

              if [ ! -f "$SIGNAL" ]; then
                printf 'signal.json not written by agent' > "{bail}"
                exit 2
              fi
              exit_state=$(jq -r '.exit_state // empty' "$SIGNAL") || {
                printf 'failed to parse exit_state from signal.json' > "{bail}"
                exit 2
              }
              case "$exit_state" in
                next-plan)
                  CHILD="{child_plan}"
                  if [ ! -f "$CHILD" ]; then
                    printf 'next-plan: child_plan not found: %s' "$CHILD" \
                      > "{bail}"
                    exit 2
                  fi
                  cp "$CHILD" "{plan}"
                  ;;
                chain-done)
                  cp "{boss_spec}" "{plan}"
                  printf 'done' > "{done}"
                  ;;
                bail)
                  jq -r '.reason // "(no reason given)"' "$SIGNAL" \
                    > "{bail}" || \
                    printf '(jq failed reading bail reason)' > "{bail}"
                  exit 2
                  ;;
                *)
                  printf 'unrecognized exit_state: %s' "$exit_state" \
                    > "{bail}"
                  exit 2
                  ;;
              esac

      - name: sanitize
        type: agent
        prompt:
          - "gremlins:handoff_sanitize.md"
          - "gremlins:code_style.md"
        interpolation:
          rolling_plan_text: content("artifact://rolling-plan.md")
          rolling_plan: artifact://rolling-plan.md
        options:
          model: haiku

      - name: restore-rolling-plan
        type: exec
        interpolation:
          rolling_plan: artifact://rolling-plan.md
          rolling_plan_pre: "artifact://rolling-plan-pre-sanitize.md"
        options:
          cmds:
            - |
              ROLLING="{rolling_plan}"
              if [ ! -s "$ROLLING" ]; then
                cp "{rolling_plan_pre}" \
                  "$ROLLING"
              fi
