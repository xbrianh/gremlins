[package]
name = "gremlins-magic-bus"
version = "0.0.0"
edition = "2021"

[lib]
name = "gremlins_magic_bus"
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
futures = "0.3"
