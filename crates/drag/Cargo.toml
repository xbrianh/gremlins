[package]
name = "drag"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gremlins-drag"
path = "src/main.rs"

[dependencies]
gremlins = { path = "../gremlins" }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
